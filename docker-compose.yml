version: "3.9"

services:
  forensis:
    build: .
    container_name: forensis
    ports:
      - "5000:5000"
    environment:
      FORENSIS_SECRET_KEY: "change-me-in-production"
      # Optional: configure external integrations
      # FORENSIS_ELASTIC_URL: "http://elasticsearch:9200"
      # FORENSIS_ELASTIC_INDEX: "forensis-events"
      # FORENSIS_LOKI_URL: "http://loki:3100"
      # FORENSIS_LOKI_LABELS: 'app="forensis",env="lab"'
      # FORENSIS_SIGMA_URLS: "https://raw.githubusercontent.com/.../rule1.yml,https://.../rule2.yml"
    volumes:
      - ./uploads:/app/uploads
