---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: forensis-worker-rules-scale
  namespace: forensis
spec:
  scaleTargetRef:
    name: forensis-worker-rules
  pollingInterval: 20
  cooldownPeriod: 90
  minReplicaCount: 1
  maxReplicaCount: 6
  triggers:
    - type: redis
      metadata:
        address: forensis-redis-master.forensis.svc.cluster.local:6379
        listName: rules
        listLength: "20"
