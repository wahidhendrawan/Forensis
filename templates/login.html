{% extends "base.html" %}

{% block content %}
<div class="row align-items-center justify-content-center min-vh-100">
    <div class="col-md-5">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold"><i class="fas fa-shield-halved text-primary"></i> Forensis</h1>
                    <p class="text-muted">Threat Analysis & Incident Response Platform</p>
                </div>

                <form method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" name="username" class="form-control" id="floatingInput" placeholder="Username" required autofocus>
                        <label for="floatingInput">Username</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                        <label for="floatingPassword">Password</label>
                    </div>

                    <button class="btn btn-primary w-100 py-2 fs-5" type="submit">Sign In</button>

                    <div class="mt-4 text-center">
                        <small class="text-muted">Protected Access Only</small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
