{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-2 text-center">Analyzing Data</h2>
                <p class="text-muted text-center mb-4">Pipeline stage and progress are updated in real time.</p>

                <div class="d-flex justify-content-center mb-4">
                    <div class="spinner-border text-primary" role="status" style="width: 2.5rem; height: 2.5rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <div class="mb-2 d-flex justify-content-between small text-muted">
                    <span id="stage-label">{{ status }}</span>
                    <span id="progress-label">0%</span>
                </div>
                <div class="progress mb-3" role="progressbar" aria-label="Analysis progress" aria-valuemin="0" aria-valuemax="100">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%">0%</div>
                </div>
                <p class="small text-muted mb-0" id="status-text">Preparing worker job...</p>
            </div>
        </div>
    </div>
</div>
<script>
    const taskId = "{{ task_id }}";
    const progressBar = document.getElementById("progress-bar");
    const progressLabel = document.getElementById("progress-label");
    const stageLabel = document.getElementById("stage-label");
    const statusText = document.getElementById("status-text");

    function prettifyStage(stage) {
        if (!stage) return "processing";
        return String(stage).replaceAll("_", " ");
    }

    function setProgress(value) {
        const pct = Math.max(0, Math.min(100, Number(value || 0)));
        progressBar.style.width = `${pct}%`;
        progressBar.textContent = `${pct}%`;
        progressLabel.textContent = `${pct}%`;
    }

    async function pollStatus() {
        try {
            const resp = await fetch(`/api/jobs/${taskId}/status`, { credentials: "same-origin" });
            if (!resp.ok) {
                statusText.textContent = "Status endpoint unavailable, retrying...";
                return;
            }
            const data = await resp.json();
            stageLabel.textContent = prettifyStage(data.stage || data.state || "processing");
            setProgress(data.progress || 0);

            if (data.failed) {
                statusText.textContent = data.error_message || "Analysis failed.";
                progressBar.classList.remove("progress-bar-animated");
                return;
            }

            statusText.textContent = `State: ${data.state || "running"}`;
            if (data.ready && data.redirect_url) {
                window.location.replace(data.redirect_url);
                return;
            }
        } catch (err) {
            statusText.textContent = "Connection interrupted, retrying...";
        }
    }

    pollStatus();
    setInterval(pollStatus, 1500);
</script>
{% endblock %}
