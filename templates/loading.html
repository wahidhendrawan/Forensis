{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <h2 class="mb-4">Analyzing Data</h2>
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted" id="status-text">{{ status }}</p>
        <p class="small text-muted">Please wait while the analysis engine processes your file in the background.</p>
    </div>
</div>
<script>
    setTimeout(function() {
        window.location.reload(1);
    }, 2000); // Reload every 2 seconds to check status
</script>
{% endblock %}
