{% extends "base.html" %}

{% block content %}
<div class="row align-items-center justify-content-center min-vh-100">
    <div class="col-md-6">
        <div class="card shadow-lg p-4">
            <div class="card-body text-center">
                <h2 class="mb-4"><i class="fas fa-mobile-alt text-primary"></i> Setup Two-Factor Authentication</h2>
                <p class="text-muted mb-4">Scan the QR code below with your Authenticator app (Google Authenticator, Authy, etc.)</p>

                <div class="mb-4 p-3 bg-white d-inline-block rounded">
                    <img src="data:image/png;base64,{{ qr_code }}" alt="MFA QR Code" class="img-fluid">
                </div>

                <p class="small text-muted mb-3">Secret Key: <code>{{ secret }}</code></p>

                <form method="POST">
                    <input type="hidden" name="secret" value="{{ secret }}">
                    <div class="input-group mb-3 w-75 mx-auto">
                        <input type="text" name="otp" class="form-control" placeholder="Enter 6-digit code to verify" required>
                        <button class="btn btn-primary" type="submit">Enable MFA</button>
                    </div>
                </form>
                <a href="{{ url_for('manage_users') }}" class="btn btn-link btn-sm text-decoration-none">Back to Users</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
